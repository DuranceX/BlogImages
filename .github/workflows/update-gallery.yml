name: Update Gallery Index

on:
  push:
    paths:
      - 'photos/**'
      - 'scripts/generate-gallery-index.js'
  workflow_dispatch: # 允许手动触发

jobs:
  update-gallery:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Generate gallery index
      run: |
        cd ${{ github.workspace }}
        node scripts/generate-gallery-index.js photos gallery-index.json "https://raw.githubusercontent.com/${{ github.repository }}/main"
        
    - name: Check for changes
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Commit and push changes
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add gallery-index.json
        git commit -m "🤖 Auto-update gallery index [skip ci]" || exit 0
        git push
        
    - name: Create deployment artifact
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        echo "Gallery index updated with $(jq '.totalPhotos' gallery-index.json) photos" >> $GITHUB_STEP_SUMMARY
        echo "Last updated: $(jq -r '.lastUpdated' gallery-index.json)" >> $GITHUB_STEP_SUMMARY